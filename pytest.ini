[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests
    regression: Regression tests
    ui: UI tests
    functional: Functional tests
    ai_response: AI response quality tests
    security: Security and injection tests
    mobile: Mobile device tests
    slow: Slow running tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
    --capture=tee-sys

# Live logging to terminal
log_cli = true
log_cli_level = INFO

# Timeout
timeout = 300
timeout_method = thread

