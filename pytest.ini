[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Command line options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers for test categorization
markers =
    ui: UI behavior tests
    ai_response: AI response validation tests  # <--- ADDED
    security: Security and injection tests   # <--- ADDED
    smoke: Smoke tests (quick validation)
    regression: Regression tests
    slow: Slow running tests
    english: Tests for English language
    arabic: Tests for Arabic language
    mobile: Mobile-specific tests
    desktop: Desktop-specific tests
    xfail: Tests expected to fail

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)-8s | %(message)s

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout (adjusted for Selenium's typical needs)
timeout = 600

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Console output options
console_output_style = progress

# Minimum pytest version
minversion = 7.0