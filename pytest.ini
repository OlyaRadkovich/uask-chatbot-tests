[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --tb=short --strict-markers -ra

markers =
    ui: UI behaviour
    ai_response: AI assistant checks
    security: security hardening
    smoke: quick path
    slow: long running
    mobile: mobile-specific tests
    desktop: desktop-specific tests
    english: English language tests
    arabic: Arabic language tests
    stealth: tests using stealth/session to mitigate CAPTCHA
    recaptcha: tests affected by CAPTCHA
    regression: broader regression suite

log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] %(levelname)s %(name)s - %(message)s

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = {"ts":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","msg":"%(message)s"}
log_file_date_format = %Y-%m-%d %H:%M:%S

timeout = 300

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

console_output_style = progress
minversion = 3.10
