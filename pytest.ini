[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests
    regression: Regression tests
    ui: UI tests
    functional: Functional tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/test_report.html
    --self-contained-html

# Timeout
timeout = 300
timeout_method = thread

